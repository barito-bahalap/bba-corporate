<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Barito Bahalap Agency | Tech & Media</title>
    <meta
      name="description"
      content="Barito Bahalap Agency is an independent holding organization based in Palangka Raya, Central Kalimantan, powering Barito Bahalap Tech and Barito Bahalap Media."
    />
    <link rel="canonical" href="https://baritobahalap.com/" />
    <meta name="robots" content="index, follow" />

    <!-- Branding & UI -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b1f1a" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph (WhatsApp, LinkedIn, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Barito Bahalap Agency" />
    <meta property="og:title" content="Barito Bahalap Agency | Tech & Media" />
    <meta
      property="og:description"
      content="Independent holding company powering software engineering and strategic media from Palangka Raya, Central Kalimantan."
    />
    <meta property="og:url" content="https://baritobahalap.com/" />
    <meta property="og:image" content="https://baritobahalap.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_ID" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Barito Bahalap Agency | Tech & Media" />
    <meta
      name="twitter:description"
      content="Independent holding company powering software engineering and strategic media from Palangka Raya, Central Kalimantan."
    />
    <meta name="twitter:image" content="https://baritobahalap.com/og-image.png" />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Barito Bahalap Agency",
        "alternateName": "BBA",
        "url": "https://baritobahalap.com/",
        "logo": "https://baritobahalap.com/favicon.svg",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Palangka Raya",
          "addressRegion": "Central Kalimantan",
          "addressCountry": "ID"
        },
        "subOrganization": [
          {
            "@type": "Organization",
            "name": "Barito Bahalap Tech"
          },
          {
            "@type": "Organization",
            "name": "Barito Bahalap Media"
          }
        ]
      }
    </script>

    <!-- Font & Asset Preconnections (Optional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <div style="padding: 2rem; font-family: sans-serif; text-align: center;">
        <h1>Barito Bahalap Agency</h1>
        <p>
          Barito Bahalap Agency is the parent organization behind Barito Bahalap Tech and Barito Bahalap Media. Please enable JavaScript to view this site.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
